{% extends 'base.html' %}
{% block titulo %}Login | DoaSangue{% endblock %}
{% block conteudo %}
<section class="cartao login-caixa">
    <img class="login-mascote" src="{{ url_for('static', filename='img/gotinha.svg') }}" alt="" width="72" height="84">
    <h1>Acesso do administrador</h1>
    <p>Entre para gerenciar os cadastros.</p>
    <form method="post">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button class="botao primario" type="submit">Entrar</button>
    </form>
    <div class="login-links">
        <a href="{{ url_for('site.autocadastro') }}">Criar cadastro</a>
        <details class="esqueci-senha">
            <summary>Esqueci minha senha</summary>
            <p>A recuperação de senha ainda não está disponível.</p>
        </details>
    </div>
</section>
{% endblock %}
